name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: these jobs only read the repository. Only the deploy job can publish.
permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The job names below (test, pages) are the status checks that .github/rulesets/protect-main.json requires.
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # JavaScript examples run on Node; C++ examples use the runner's g++ (GCC 13, C++20)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r requirements.txt
      # content checks, every example and project in all three languages, pages, run-API guards, static build
      - run: python -m pytest -q

  pages:
    name: pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # The static copy for GitHub Pages (no server: Run shows the expected output). Built and link-checked on every
      # pull request so a break is caught before merge; only main uploads it for deployment.
      - run: python scripts/build_pages.py --base "/${{ github.event.repository.name }}"
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  # Publishes the site once both checks pass on main. Needs Settings -> Pages -> Source: "GitHub Actions".
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [test, pages]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
